<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu Quán Ăn</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <!-- Optional logo placeholder -->
      <div class="logo" aria-label="Logo quán ăn">
        <!-- You can replace this with an actual logo image -->
        <span class="logo-text">🍜</span>
      </div>
      <h1>Tên Quán Ăn Của Bạn</h1>
      <p>Gọi món qua Zalo - Nhận ngay!</p>
    </header>

    <main id="menu"></main>

    <section class="order-form">
      <h2>Thông tin giao hàng</h2>
      <div class="form-group">
        <label for="name">Họ và tên <span class="required">*</span></label>
        <input type="text" id="name" name="name" required>
      </div>
      <div class="form-group">
        <label for="phone">Số điện thoại <span class="required">*</span></label>
        <input type="tel" id="phone" name="phone" required>
      </div>
      <div class="form-group">
        <label for="address">Địa chỉ giao hàng <span class="required">*</span></label>
        <input type="text" id="address" name="address" required>
      </div>
      <button id="orderBtn">Gửi đơn qua Zalo</button>
    </section>
  </div>
  <script src="menu.json"></script>
  <script src="script.js"></script>
</body>
</html>
